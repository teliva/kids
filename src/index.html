<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/design-tokens.css" />

  <style>
    body {
      padding: 0;
      margin: 0;
    }

    .app {
      flex: 1;
      position: relative;
    }

    html {
      height: 100%;
      width: 100%;
    }

    .top-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 100%;
    }

    .side-panel {
      display: flex;
      align-items: flex-start;
      width: 350px;
      border-left: 1px solid var(--kd-color-gray-30);
      padding-top: 1rem;
    }

    .app-container {
      display: flex;
      flex-direction: row;
      flex: 1;

    }

    .toc-navigation {
      position: absolute;
      top: 0;
      padding: 1rem;
    }

    .calls-to-action {
      position: absolute;
      bottom: 0;
      padding: 1rem;
    }

    .grid {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(4, 60px);
      /* Scales fluidly from 0.75rem (12px) on small screens to 1.5rem (24px) on large screens */
      gap: 1rem;
    }
  </style>


  <title>kids</title>
</head>

<body>
  <div class="top-container">
    <kd-loader style="position:absolute; top:0;" value="90"></kd-loader>
    <div class="app-container">
      <div id="app" class="app">
        <div class="toc-navigation">
          <svg data-v-39ea7f52="" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-table-of-contents-icon lucide-table-of-contents lucide-icon customizable">
            <path d="M16 5H3"></path>
            <path d="M16 12H3"></path>
            <path d="M16 19H3"></path>
            <path d="M21 5h.01"></path>
            <path d="M21 12h.01"></path>
            <path d="M21 19h.01"></path>
          </svg>
        </div>
        <div class="calls-to-action">
          <kd-button appearance="solid" id="render-btn">
            <svg slot="icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="#e3e3e3">
              <path
                d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm40-80h480L570-480 450-320l-90-120-120 160Zm-40 80v-560 560Z" />
            </svg>
            <span slot="label">Image</span>
          </kd-button>
          <kd-switch label="Enable notifications" checked></kd-switch>
          <kd-switch label="Disabled" disabled></kd-switch>
        </div>
      </div>
      <div class="side-panel">
        <div class="grid">
          <div style="height:60px; width:60px; border-radius:0.375rem; overflow:hidden;"><img
              src="https://kits.kisp.com/swatch/kfi_1504/BB(U)-sm.jpg"
              style="width:100%; height:100%; object-fit:cover; display:block;" /></div>
          <div style="height:60px; width:60px; border-radius:0.375rem; overflow:hidden;"><img
              src="https://kits.kisp.com/swatch/kfi_1504/BB(U)-sm.jpg"
              style="width:100%; height:100%; object-fit:cover; display:block;" /></div>
          <div style="height:60px; width:60px; border-radius:0.375rem; overflow:hidden;"><img
              src="https://kits.kisp.com/swatch/kfi_1504/BB(U)-sm.jpg"
              style="width:100%; height:100%; object-fit:cover; display:block;" /></div>
          <div style="height:60px; width:60px; border-radius:0.375rem; overflow:hidden;"><img
              src="https://kits.kisp.com/swatch/kfi_1504/BB(U)-sm.jpg"
              style="width:100%; height:100%; object-fit:cover; display:block;" /></div>
          <div style="height:60px; width:60px; border-radius:0.375rem; overflow:hidden;"><img
              src="https://kits.kisp.com/swatch/kfi_1504/BB(U)-sm.jpg"
              style="width:100%; height:100%; object-fit:cover; display:block;" /></div>
          <div style="height:60px; width:60px; border-radius:0.375rem; overflow:hidden;"><img
              src="https://kits.kisp.com/swatch/kfi_1504/BB(U)-sm.jpg"
              style="width:100%; height:100%; object-fit:cover; display:block;" /></div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
