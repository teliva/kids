<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/spacing.css" />

  <style>
    body {
      padding: 0;
      margin: 0;
      font-size:1rem;
    }

    .app {
      flex: 1;
      position: relative;
    }

    html {
      height: 100%;
      width: 100%;
    }

    h2 {
      font-size: var(--kd-font-size-xl);
    }

    .top-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 100%;
    }

    .side-panel {
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      width: 350px;
      border-left: 1px solid var(--kd-color-gray-30);
      overflow: visible;
      transition: width 0.2s ease;
    }

    .side-panel.collapsed {
      width: 48px;
    }

    .app-container {
      display: flex;
      flex-direction: row;
      flex: 1;
    }

    .side-panel-header {
      display: flex;
      align-items: center;
      padding: var(--kd-space-layout-gap-md);
      flex-shrink: 0;
      position: relative;
    }

    #panel-toggle-btn {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .side-panel.collapsed .side-panel-header h2 {
      display: none;
    }

    .side-panel.collapsed kd-swatch-group {
      display: none;
    }

    .calls-to-action {
      position: absolute;
      display:flex;
      bottom: 0;
      padding: var(--kd-space-layout-gap-md);
      gap: var(--kd-space-layout-gap-md);
    }

    kd-swatch-group {
      align-self: center;
      padding: var(--kd-space-layout-gap-md);
      --kd-swatch-group-item-size: 60px;
    }
  </style>


  <title>kids</title>
</head>

<body>
  <div class="top-container">
    <div class="app-container">
      <div id="app" class="app">
        <div class="calls-to-action">
          <kd-button appearance="outline" variant="neutral" id="render-btn">
            <svg slot="icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="currentColor">
              <path
                d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm40-80h480L570-480 450-320l-90-120-120 160Zm-40 80v-560 560Z" />
            </svg>
            <span slot="label">Download Image</span>
          </kd-button>
          <kd-button appearance="outline" variant="danger" id="render-btn">
            <svg slot="icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="currentColor">
              <path
                d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm40-80h480L570-480 450-320l-90-120-120 160Zm-40 80v-560 560Z" />
            </svg>
            <span slot="label">Download PDF</span>
          </kd-button>
        </div>
      </div>
      <div class="side-panel">
        <div class="side-panel-header">
          <kd-button appearance="plain" id="panel-toggle-btn" aria-expanded="true" aria-label="Collapse panel">
              <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/></svg>
          </kd-button>
          <h2>Fabric</h2>
        </div>
        <kd-swatch-group label="Fabric finish" name="fabric" value="kfi_1504" columns="4">
          <kd-swatch value="kfi_1504" label="Ballistic Blue"
            src="https://kits.kisp.com/swatch/kfi_1504/BB(U)-sm.jpg"></kd-swatch>
          <kd-swatch value="kfi_1505" label="Forest Green"
            src="https://kits.kisp.com/swatch/kfi_1504/FG(U)-sm.jpg"></kd-swatch>
          <kd-swatch value="kfi_1506" label="Slate Gray"
            src="https://kits.kisp.com/swatch/kfi_1504/SG(U)-sm.jpg"></kd-swatch>
          <kd-swatch value="kfi_1507" label="Charcoal"
            src="https://kits.kisp.com/swatch/kfi_1504/CH(U)-sm.jpg"></kd-swatch>
          <kd-swatch value="kfi_1508" label="Sandstone"
            src="https://kits.kisp.com/swatch/kfi_1504/SS(U)-sm.jpg"></kd-swatch>
          <kd-swatch value="kfi_1509" label="Broken link demo" src="https://kits.kisp.com/does-not-exist.jpg">
          </kd-swatch>
        </kd-swatch-group>
      </div>
    </div>
  </div>

  <script>
    const sidePanel = document.querySelector('.side-panel');
    const panelToggleBtn = document.getElementById('panel-toggle-btn');

    panelToggleBtn.addEventListener('click', () => {
      const collapsed = sidePanel.classList.toggle('collapsed');
      panelToggleBtn.setAttribute('aria-expanded', String(!collapsed));
      panelToggleBtn.setAttribute('aria-label', collapsed ? 'Expand Fabric panel' : 'Collapse Fabric panel');
    });
  </script>
</body>

</html>
