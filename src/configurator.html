<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/spacing.css" />

  <style>
    body {
      padding: 0;
      margin: 0;
      font-size: var(--kd-font-size-md);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-attachment: fixed;
      background-size: cover;
      font-family: var(--kd-font-family);
      font-size: 16px;
      background-color: #f4f3f0;
      height: 100%;
      width: 100%;
    }

    .app {
      flex: 1;
      position: relative;
      /* Stacked layout (narrow): give the viewer real height, since its only
         child (.calls-to-action) is absolutely positioned */
      min-height: 60vh;
    }

    html {
      height: 100%;
      width: 100%;
    }

    h2 {
      font-size: var(--kd-font-size-2xl);
    }

    .top-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 100%;
    }

    /* Outer box only animates width and clips; padding lives on
       .drawer-content so it can reach 0 and content doesn't reflow mid-slide */
    .drawer {
      --drawer-width: 300px;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      transition: width 0.2s ease;

    }

    .drawer-content {
      box-sizing: border-box;
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      padding: var(--kd-space-layout-gap-md);
      /* Stays visible until the collapse finishes; keeps hidden swatches out of tab order */
      transition: visibility 0.2s;
    }

    .drawer.collapsed .drawer-content {
      visibility: hidden;
    }

    /* Narrow (base): viewer on top, panel full-width underneath */
    .app-container {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      position: relative;
    }

    .calls-to-action {
      position: absolute;
      display: flex;
      bottom: 0;
      padding: var(--kd-space-layout-gap-sm);
      gap: var(--kd-space-layout-gap-sm);
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      border:1px solid pink;
    }

    /* Fill the panel width: as many fixed-size columns as fit, with leftover
       space spread between them so both edges line up with the padding.
       300px desktop panel -> 4 columns; phones get more. */
    .swatch-grid {
      --swatch-size: 60px;
      align-self: stretch;
      display: grid;
      grid-template-columns: repeat(auto-fill, var(--swatch-size));
      justify-content: space-between;
      gap: var(--kd-space-2);
    }

    .swatch-grid kd-swatch {
      --size: var(--swatch-size);
    }

    /* Narrow (base): rail runs as a row between viewer and panel */
    .panel-rail,
    .panel-rail-tabs {
      display: flex;
      flex-direction: row;
      flex-shrink: 0;
      gap: var(--kd-space-layout-gap-sm);
    }

    /* Collapse only applies side-by-side; hidden when stacked */
    .panel-rail-toggle {
      display: none;
    }

    .panel-rail-toggle svg[hidden] {
      display: none;
    }

    /* Mid: 768px+ (--kd-breakpoint-mid) - side-by-side layout */
    @media (min-width: 48em) {
      .app-container {
        flex-direction: row;
      }

      .app {
        min-height: 0;
      }

      .drawer-container {
        background-color: var(--kd-color-gray-05);
      }

      .drawer {
        width: var(--drawer-width);
      }

      .drawer.collapsed {
        width: 0;
      }

      .drawer-content {
        width: var(--drawer-width);
      }

      .calls-to-action {
        flex-wrap: nowrap;
      }

      .panel-rail,
      .panel-rail-tabs {
        flex-direction: column;
      }

      /* Top of the rail, divided from the tabs below it */
      .panel-rail-toggle {
        display: inline-block;
        padding-bottom: var(--kd-space-layout-gap-sm);
        border-bottom: 1px solid var(--kd-color-gray-20);
      }
    }

    @media (min-width: 64em) {
      .drawer {
        --drawer-width: 300px;
      }
    }
  </style>
  <title>KIDS</title>
</head>

<body>
  <div class="top-container">
    <div class="app-container">
      <kd-button variant="neutral" size="sm" appearance="plain" style="position: absolute; top:0; left:0; z-index: 1;">
        <svg slot="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"

          <path d="M16 5H3"></path>
          <path d="M16 12H3"></path>
          <path d="M16 19H3"></path>
          <path d="M21 5h.01"></path>
          <path d="M21 12h.01"></path>
          <path d="M21 19h.01"></path>

        <div class="calls-to-action">

              <circle cx="9" cy="9" r="2"></circle>

            </svg>
          </kd-button>
          <kd-tooltip for="download-pdf" content="Download PDF" placement="top"></kd-tooltip>
          <kd-button appearance="outline" variant="neutral" id="download-pdf" size="sm">
            <svg slot="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-file-text lucide-icon customizable" aria-hidden="true">

                d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z">
              </path>
              <path d="M14 2v5a1 1 0 0 0 1 1h5"></path>
              <path d="M10 9H8"></path>
              <path d="M16 13H8"></path>
              <path d="M16 17H8"></path>
            </svg>
          </kd-button>
          <kd-tooltip for="ar-experience" content="Generate AR Experience" placement="top"></kd-tooltip>
          <kd-button appearance="outline" variant="neutral" id="ar-experience" size="sm">
            <svg slot="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-scan-box lucide-icon customizable" aria-hidden="true">

              <path d="M17 3h2a2 2 0 012 2v2"></path>
              <path d="M21 17v2a2 2 0 01-2 2h-2"></path>  
              <path d="M3 7V5a2 2 0 012-2h2"></path>
              <path d="M7 21H5a2 2 0 01-2-2v-2"></path>
              <path d="M7.264 9.252 12 12l4.737-2.748"></path>
              <path
                d="M7.995 8.514A2 2 0 007 10.244v3.516a2 2 0 00.996 1.73l3 1.74a2 2 0 002.008 0l3-1.74A2 2 0 0017 13.76v-3.517a2 2 0 00-.995-1.73l-3-1.742a2 2 0 00-1.892-.064z">
              </path>
            </svg>
          </kd-button>
          <kd-tooltip for="share" content="Share product" placement="top"></kd-tooltip>
          <kd-button appearance="outline" variant="neutral" id="share" size="sm">
            <svg slot="icon" data-v-39ea7f52="" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" class="lucide lucide-share-2 lucide-icon customizable" aria-hidden="true">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"></line>
              <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"></line>
            </svg>
          </kd-button>
          <kd-tooltip for="project" content="View project" placement="top"></kd-tooltip>
          <kd-button appearance="outline" variant="neutral" id="project" size="sm">
            <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-open lucide-icon customizable" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>
            <kd-badge slot="badge" variant="brand" pill>4</kd-badge>
          </kd-button>
          <kd-tooltip for="add-project" content="Add product to project" placement="top"></kd-tooltip>
          <kd-button appearance="solid" variant="brand" id="add-project" size="sm" pill>
            <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus lucide-icon customizable" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
          </kd-button>
          <kd-button appearance="solid" variant="brand" id="get-quote" size="sm" pill>
            <span slot="label">Get Quote</span>
          </kd-button>
        </div>
      </div>
      <div class="drawer-container">
        <kd-accordion>
          <kd-accordion-item open>
            <span slot="header" style="display:flex; width:100%">
              Fabric <kd-badge variant="warning" pill style="margin-inline-start:auto">Incomplete</kd-badge>
            </span>
            <div class="drawer" id="drawer">
              <div class="drawer-content">
                <div class="drawer-header">
                  <h2>Fabric</h2>
                </div>
                <div class="swatch-grid" role="radiogroup" aria-label="Fabric finish">
                  <kd-swatch value="kfi_1504" label="Ballistic Blue" checked
                    src="https://kits.kisp.com/swatch/kfi_1504/BB(U)-sm.jpg"></kd-swatch>
                  <kd-swatch value="kfi_1505" label="Forest Green"
                    src="https://kits.kisp.com/swatch/kfi_1504/FG(U)-sm.jpg"></kd-swatch>
                  <kd-swatch value="kfi_1506" label="Slate Gray"
                    src="https://kits.kisp.com/swatch/kfi_1504/SG(U)-sm.jpg"></kd-swatch>
                  <kd-swatch value="kfi_1507" label="Charcoal"
                    src="https://kits.kisp.com/swatch/kfi_1504/CH(U)-sm.jpg"></kd-swatch>
                  <kd-swatch value="kfi_1508" label="Sandstone"
                    src="https://kits.kisp.com/swatch/kfi_1504/SS(U)-sm.jpg"></kd-swatch>
                  <kd-swatch value="kfi_1509" label="Broken link demo" src="https://kits.kisp.com/does-not-exist.jpg">
                  </kd-swatch>
                </div>
              </div>
            </div>
          </kd-accordion-item>
          <kd-accordion-item>
            <span slot="header">Frame
              <kd-badge variant="success" size="sm" pill style="margin-inline-start:auto">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
              </kd-badge>
            </span>
          </kd-accordion-item>
        </kd-accordion>
      </div>
    </div>
  </div>
  </div>

  <script>
    const sidePanel = document.querySelector('.drawer');
    const panelToggleBtn = document.getElementById('panel-toggle-btn');

    function setCollapsed(collapsed) {
      sidePanel.classList.toggle('collapsed', collapsed);
      panelToggleBtn.setAttribute('aria-expanded', String(!collapsed));
      panelToggleBtn.setAttribute('aria-label', collapsed ? 'Expand panel' : 'Collapse panel');
      // SVG elements have no .hidden property, so toggle the attribute
      panelToggleBtn.querySelector('.icon-collapse').toggleAttribute('hidden', collapsed);
      panelToggleBtn.querySelector('.icon-expand').toggleAttribute('hidden', !collapsed);
    }

    // Swatch radios live in separate shadow roots, so enforce exclusive selection here
    const swatchGrid = document.querySelector('.swatch-grid');

    swatchGrid.addEventListener('kd-change', (event) => {
      swatchGrid.querySelectorAll('kd-swatch').forEach((swatch) => {
        swatch.checked = swatch === event.target;
      });
    });
  </script>
</body>

</html>
