<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/spacing.css" />

  <style>
    
    body {
      padding: 0;
      margin: 0;
      font-size: var(--kd-font-size-md);
      --kd-color-background: #f4f3f0;
    }

    body {
      
      margin: 0;
      min-height: 100vh;
      background-attachment: fixed;
      background-size: cover;
      font-family: var(--kd-font-family);
      font-size: 16px;
      background-color: var(--kd-color-background);
      height: 100%;
      width: 100%;
    }

    .app {
      flex: 1;
      position: relative;
    }

    html {
      height: 100%;
      width: 100%;
    }

    h2 {
      font-size: var(--kd-font-size-2xl);
    }

    .top-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 100%;
    }

    /* Toggle strip + drawer. Narrow (base): floats over the viewer's right
       edge so an open drawer doesn't squeeze the viewer on phones */
    .drawer-dock {
      --drawer-width: min(300px, calc(100vw - 4rem));
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
    }

    .drawer-container {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      /* Same color as the page, but opaque: on narrow screens the drawer
         floats over the viewer, which must not show through */
      background-color: var(--kd-color-background);
      border-left: 1px solid var(--kd-color-gray-30);
    }

    /* Outer box only animates width and clips; .drawer-content keeps a fixed
       width so the accordion doesn't reflow mid-slide */
    .drawer {
      /* Fill the column so the open-drawer shadow runs full height */
      flex: 1 0 auto;
      position: relative;
      width: var(--drawer-width);
      overflow: hidden;
      transition: width 0.2s ease;
    }

    .drawer.collapsed {
      width: 0;
    }

    /* Lift the open drawer off the viewer it overlaps; only while open, so a
       collapsed (0-width) drawer doesn't leave a shadow line at the edge */
    .drawer:not(.collapsed) {
      box-shadow: var(--kd-box-shadow-lg);
      /* Clip the shadow on top/right/bottom; the -2rem lets it spill out on the left only */
      clip-path: inset(0 0 0 -2rem);
    }

    .drawer-content {
      box-sizing: border-box;
      width: var(--drawer-width);
      /* Stays visible until the collapse finishes; keeps hidden controls out of tab order */
      transition: visibility 0.2s;
    }

    .drawer.collapsed .drawer-content {
      visibility: hidden;
    }

    .option-panel {
      box-sizing: border-box;
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      padding: var(--kd-space-layout-gap-md);
    }

    .drawer-toolbar {
      display: flex;
      padding: var(--kd-space-layout-gap-sm);
    }

    /* Radius matches kd-button's inner button so the shadow follows its corners */
    .drawer-toggle {
      /* Center in the full-height toolbar; not stretch, or the shadow outlines the whole strip */
      align-self: center;
      border-radius: var(--kd-radius-md);
      box-shadow: var(--kd-box-shadow-sm);
    }

    .drawer-toggle svg[hidden] {
      display: none;
    }

    /* Viewer and drawer side by side at every width */
    .app-container {
      position: relative;
      display: flex;
      flex-direction: row;
      flex: 1;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      position: relative;
    }

    .calls-to-action {
      display: flex;
      padding: var(--kd-space-layout-gap-sm);
      gap: var(--kd-space-layout-gap-sm);
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      border-top: 1px solid var(--kd-color-gray-30);
    }

    .quote-form {
      display: flex;
      flex-direction: column;
      gap: var(--kd-space-layout-gap-md);
    }

    .quote-intro {
      margin: 0;
      color: var(--kd-color-gray-60);
      font-size: var(--kd-font-size-sm);
    }

    /* Fill the panel width: as many fixed-size columns as fit, with leftover
       space spread between them so both edges line up with the padding.
       Narrower phone drawers get fewer columns. */
    .swatch-grid {
      --swatch-size: 60px;
      align-self: stretch;
      display: grid;
      grid-template-columns: repeat(auto-fill, var(--swatch-size));
      justify-content: space-between;
      gap: var(--kd-space-2);
    }

    .swatch-grid kd-swatch {
      --size: var(--swatch-size);
    }

    /* Narrow (base): rail runs as a row between viewer and panel */
    .panel-rail,
    .panel-rail-tabs {
      display: flex;
      flex-direction: row;
      flex-shrink: 0;
      gap: var(--kd-space-layout-gap-sm);
    }

    /* Mid: 768px+ (--kd-breakpoint-mid) - drawer docks beside the viewer */
    @media (min-width: 48em) {
      .drawer-dock {
        --drawer-width: 340px;
        position: static;
        flex-shrink: 0;
      }

      .drawer:not(.collapsed) {
        box-shadow: none;
      }

      .calls-to-action {
        flex-wrap: nowrap;
      }

      .panel-rail,
      .panel-rail-tabs {
        flex-direction: column;
      }
    }
  </style>
  <title>KIDS</title>
</head>

<body>

                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"

          <circle cx="9" cy="9" r="2"></circle>
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>

      <kd-tooltip for="download-pdf" content="Download PDF" placement="top"></kd-tooltip>

        <svg slot="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"

  <kd-dialog id="quote-dialog" label="Request a quote">
    <form id="quote-form" class="quote-form">
      <p class="quote-intro">Tell us how to reach you and we'll send pricing for your configuration.</p>
      <kd-input name="name" label="Name" autocomplete="name" required></kd-input>
      <kd-input name="email" label="Email" type="email" autocomplete="email" placeholder="you@example.com"
        required></kd-input>
      <kd-input name="phone" label="Phone" type="tel" autocomplete="tel" hint="Optional"></kd-input>
      <kd-input name="quantity" label="Quantity" type="number" inputmode="numeric" min="1" value="1"
        required></kd-input>
    </form>
    <kd-button slot="footer" data-dialog="close" appearance="outline" variant="neutral" size="sm">
      <span slot="label">Cancel</span>
    </kd-button>
    <kd-button slot="footer" type="submit" form="quote-form" variant="brand" size="sm">
      <span slot="label">Request quote</span>
    </kd-button>
  </kd-dialog>


  <script>
    const sidePanel = document.querySelector('.drawer');
    const panelToggleBtn = document.getElementById('panel-toggle-btn');

    function setCollapsed(collapsed) {
      sidePanel.classList.toggle('collapsed', collapsed);
      panelToggleBtn.setAttribute('aria-expanded', String(!collapsed));
      // Both icons are aria-hidden, so the button needs an explicit name
      panelToggleBtn.setAttribute('aria-label', collapsed ? 'Expand panel' : 'Collapse panel');
      // SVG elements have no .hidden property, so toggle the attribute
      panelToggleBtn.querySelector('.icon-collapse').toggleAttribute('hidden', collapsed);
      panelToggleBtn.querySelector('.icon-expand').toggleAttribute('hidden', !collapsed);
    }

    // Toasts are created on demand so several can stack; see KdToast.toast()
    document.getElementById('download-png').addEventListener('click', () => {
      customElements.get('kd-toast').toast('Image Requested', {
        variant: 'success',
        placement: 'bottom',
      });
    });

    // Keep bottom toasts above the footer; it wraps on narrow screens, so track its height
    const footer = document.querySelector('.calls-to-action');
    new ResizeObserver(() => {
      document.documentElement.style.setProperty(
        '--kd-toast-offset-bottom',
        `calc(${footer.offsetHeight}px + var(--kd-space-layout-gap-md))`,
      );
    }).observe(footer);

    const quoteDialog = document.getElementById('quote-dialog');
    const quoteForm = document.getElementById('quote-form');

    document.getElementById('get-quote').addEventListener('click', () => (quoteDialog.open = true));

    // Set on submit; the reset waits for the fade-out so the fields don't empty
    // while visible. Cancel never sets it, so an unfinished request is kept
    let resetPending = false;

    function resetIfPending() {
      if (!resetPending) return;
      resetPending = false;
      quoteForm.reset();
    }

    quoteDialog.addEventListener('kd-after-hide', resetIfPending);
    // Reopened before the fade-out finished: that close never completes, so
    // reset now rather than on some later, unrelated close
    quoteDialog.addEventListener('kd-show', resetIfPending);

    // The footer's type="submit" form="quote-form" button and Enter in a field
    // both submit; this only fires once every field is valid
    quoteForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const quote = Object.fromEntries(new FormData(quoteForm));
      console.log('Quote requested', quote);

      resetPending = true;
      quoteDialog.hide();

      customElements.get('kd-toast').toast('Quote requested', {
        variant: 'success',
        placement: 'bottom',
      });
    });

    panelToggleBtn.addEventListener('click', () => {
      setCollapsed(!sidePanel.classList.contains('collapsed'));
    });

    // Narrow screens start collapsed, since the open drawer covers the viewer.
    // Literal 48em mirrors --kd-breakpoint-mid (custom properties can't be used in media queries)
    const narrowQuery = window.matchMedia('(max-width: 47.99em)');
    setCollapsed(narrowQuery.matches);
    narrowQuery.addEventListener('change', (event) => setCollapsed(event.matches));

    // Swatch radios live in separate shadow roots, so enforce exclusive selection here
    const swatchGrid = document.querySelector('.swatch-grid');

    swatchGrid.addEventListener('kd-change', (event) => {
      swatchGrid.querySelectorAll('kd-swatch').forEach((swatch) => {
        swatch.checked = swatch === event.target;
      });
    });
  </script>
</body>
